---
- name: Configure localhost
  hosts: workstations
  roles:
    - role: shells
      tags: ["shells"]
    - role: dotfiles
      tags: ["dotfiles"]
    - role: ssh
      tags: ["ssh"]
    - role: asdf # installs runtimes and shims — must precede dev_tools and nvim
      tags: ["asdf"]
    - role: dev_tools # installs git, mas, and other CLI tools
      tags: ["dev_tools"]
    - role: nvim
      tags: ["nvim"]
    - role: macos_apps
      tags: ["macos_apps"]
      when: ansible_facts['system'] == 'Darwin'
    - role: macos
      tags: ["macos"]
      when: ansible_facts['system'] == 'Darwin'
    - role: hammerspoon
      tags: ["hammerspoon"]
      when: ansible_facts['system'] == 'Darwin'
    - role: macos_navigation
      tags: ["macos_navigation"]
      when: ansible_facts['system'] == 'Darwin'
    - role: fonts
      tags: ["fonts"]
      when: ansible_facts['system'] == 'Darwin'
    - role: macos_dictionaries
      tags: ["dictionaries"]
      when: ansible_facts['system'] == 'Darwin'
    - role: alfred
      tags: ["alfred"]
      when: ansible_facts['system'] == 'Darwin'

- name: Configure home servers
  hosts: servers
  roles:
    - role: passwordless_sudo
      tags: ["passwordless_sudo"]
    - role: firewall
      tags: ["firewall"]
    # - role: data_mount # must precede docker — see docker role's RequiresMountsFor/BindsTo
    #   tags: ["data_mount"]
    - role: docker
      tags: ["docker"]
    - role: service_data # must follow data_mount — sets group/perms on base_data
      tags: ["service_data"]
    - role: unattended_upgrades
      tags: ["unattended_upgrades"]
    - role: tailscale
      tags: ["tailscale"]
    - role: docktail # must follow docker and tailscale
      tags: ["docktail"]
    - role: traefik # must follow docker
      tags: ["traefik"]
    - role: wake_on_lan
      tags: ["wake_on_lan"]
    - role: no_suspend
      tags: ["no_suspend"]
    - role: display_scale
      tags: ["display_scale"]
