---
- name: Configure localhost
  hosts: workstations
  roles:
    - role: wrapped_tools # provides the shim dir shells puts on PATH — must precede shells
      tags: ["wrapped_tools"]
    - role: shells
      tags: ["shells"]
    - role: dotfiles
      tags: ["dotfiles"]
    - role: ssh
      tags: ["ssh"]
    - role: asdf # installs runtimes and shims — must precede dev_tools and nvim
      tags: ["asdf"]
    - role: dev_tools # installs git, mas, and other CLI tools
      tags: ["dev_tools"]
    - role: nvim
      tags: ["nvim"]
    - role: macos_apps
      tags: ["macos_apps"]
      when: ansible_facts['system'] == 'Darwin'
    - role: macos
      tags: ["macos"]
      when: ansible_facts['system'] == 'Darwin'
    - role: hammerspoon
      tags: ["hammerspoon"]
      when: ansible_facts['system'] == 'Darwin'
    - role: macos_navigation
      tags: ["macos_navigation"]
      when: ansible_facts['system'] == 'Darwin'
    - role: fonts
      tags: ["fonts"]
      when: ansible_facts['system'] == 'Darwin'
    - role: macos_dictionaries
      tags: ["dictionaries"]
      when: ansible_facts['system'] == 'Darwin'
    - role: alfred
      tags: ["alfred"]
      when: ansible_facts['system'] == 'Darwin'

- name: Configure Debian machines
  hosts: debian
  roles:
    - role: passwordless_sudo
      tags: ["passwordless_sudo"]
    - role: tailscale # must precede firewall — SSH is tailscale-only, so the box
      tags: ["tailscale"] # needs to already be on the tailnet before ufw locks LAN SSH out
    - role: firewall
      tags: ["firewall"]
    - role: unattended_upgrades
      tags: ["unattended_upgrades"]

- name: Configure home servers
  hosts: servers
  roles:
    # - role: external_mounts # must precede docker — see docker role's RequiresMountsFor
    #   tags: ["external_mounts"]
    # ^ Disabled until the drive itself is physically moved from the old
    # server to this one. Enabling it before then makes docker.service hard-
    # depend on a mount unit for a drive that isn't attached — the mount
    # fails, and docker (and everything on top: Traefik, DockTail) refuses
    # to start. Once the drive's plugged in: uncomment, confirm each
    # device in vault_external_mounts still matches (`ls -l
    # /dev/disk/by-id/`), then re-run with --tags external_mounts,service_data.
    - role: internal_mounts # must precede docker — see docker role's RequiresMountsFor
      tags: ["internal_mounts"]
    - role: docker
      tags: ["docker"]
    - role: service_data # must follow docker (creates /var/lib/docker/volumes) and internal_mounts/external_mounts
      tags: ["service_data"]
    - role: docktail # must follow docker and tailscale
      tags: ["docktail"]
    - role: traefik # must follow docker
      tags: ["traefik"]

- name: Configure TV/gaming machines
  hosts: tv
  roles:
    - role: wake_on_lan
      tags: ["wake_on_lan"]
    - role: no_suspend
      tags: ["no_suspend"]
    - role: display_scale
      tags: ["display_scale"]
    - role: tv_user
      tags: ["tv_user"]
    - role: steam_bigpicture # must follow tv_user — needs its home directory
      tags: ["steam_bigpicture"]
    - role: prism_launcher
      tags: ["prism_launcher"]
