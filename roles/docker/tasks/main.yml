---
- name: Install dependencies
  ansible.builtin.apt:
    name: "{{ item }}"
    state: present
    update_cache: false
  loop:
    - ca-certificates
    - curl
    - gnupg
  become: true

- name: Add docker repository to apt
  ansible.builtin.deb822_repository:
    name: docker
    types: deb
    uris: https://download.docker.com/linux/debian
    suites: "{{ ansible_facts['distribution_release'] }}"
    components: stable
    architectures: "{{ 'arm64' if ansible_facts['architecture'] == 'aarch64' else 'amd64' }}"
    signed_by: https://download.docker.com/linux/debian/gpg
    state: present
  become: true

- name: Install docker
  ansible.builtin.apt:
    name: "{{ item }}"
    state: present
    update_cache: true
  loop:
    - docker-ce
    - docker-ce-cli
    - containerd.io
    - docker-compose-plugin
  become: true

- name: Ensure docker.service drop-in directory exists
  ansible.builtin.file:
    path: /etc/systemd/system/docker.service.d
    state: directory
    owner: root
    group: root
    mode: "0755"
  become: true

- name: Make docker.service hard-depend on external_mounts/internal_mounts being mounted
  ansible.builtin.copy:
    dest: /etc/systemd/system/docker.service.d/require-mounts.conf
    content: |
      [Unit]
      RequiresMountsFor={{ ((external_mounts | default([])) + (internal_mounts | default([]))) | map(attribute='path') | join(' ') }}
    owner: root
    group: root
    mode: "0644"
  become: true
  notify: Reload systemd for docker
  when: (external_mounts | default([]) | length > 0) or (internal_mounts | default([]) | length > 0)
  # RequiresMountsFor pulls in both Requires= and After= on the mount
  # unit(s), so docker.service actually blocks on them instead of merely
  # ordering after them like the implicit local-fs.target dependency does —
  # if a mount fails, docker.service fails loudly rather than starting
  # against an empty root-disk directory.
  #
  # Covers external_mounts (removable) and internal_mounts (fixed drives
  # that still need real mount management, e.g. a second internal NVMe) —
  # internal_data_paths is always-attached storage that this repo doesn't
  # manage as a mount at all, and everything else lives in Docker named
  # volumes (/var/lib/docker/volumes), which need no mount dependency of
  # their own.
  #
  # Requires= only governs *starting* docker.service — it does nothing if a
  # mount goes away later while docker.service is already running, and
  # deliberately isn't backed by a BindsTo= here: that would stop the whole
  # daemon (every container, not just ones on that mount) each time a
  # drive dropped out. The external_mounts role handles the narrower case
  # instead — restarting just the containers actually mounting a given path
  # once it comes back, while docker.service and everything else keeps
  # running throughout. internal_mounts has no equivalent (its drives can't
  # be hot-unplugged), so it doesn't need one either.

- name: Reassert IPv6 forwarding after docker starts
  ansible.builtin.copy:
    dest: /etc/systemd/system/docker.service.d/restore-ipv6-forwarding.conf
    content: |
      [Service]
      ExecStartPost=/usr/sbin/sysctl -w net.ipv6.conf.all.forwarding=1
    owner: root
    group: root
    mode: "0644"
  become: true
  notify: Reload systemd for docker
  when: (tailscale_advertise_routes | default([]) | length > 0) or (tailscale_advertise_exit_node | default(false))
  # dockerd resets net.ipv6.conf.all.forwarding to 0 on every start (its
  # default bridge setup disables it unless Docker's own IPv6 networking is
  # configured), clobbering the tailscale role's sysctl task even though
  # that task runs first and sets it correctly. Without this, the console
  # keeps reporting "IP forwarding disabled" for subnet routes / exit-node
  # relay after every docker restart or reboot, even though ip_forward
  # (IPv4) stays fine — only the IPv6 flag gets clobbered.

- name: Configure docker daemon defaults
  ansible.builtin.copy:
    dest: /etc/docker/daemon.json
    content: "{{ {'log-driver': docker_daemon_log_driver, 'log-opts': docker_daemon_log_opts} | to_nice_json }}\n"
    owner: root
    group: root
    mode: "0644"
  become: true
  notify: Restart docker
  # Without a default cap, json-file logs grow unbounded for any container
  # that doesn't set its own `logging:` block. Only applies to containers
  # created after the daemon restarts — existing ones keep their old config
  # until recreated.

- name: Start docker
  ansible.builtin.systemd:
    name: docker
    state: started
    enabled: true
  become: true

- name: Add user to docker group
  ansible.builtin.user:
    name: "{{ docker_user }}"
    groups: docker
    append: true
    state: present
  become: true
  # Lets `docker compose --context home ...` from elsewhere deploy over SSH
  # without needing root on the remote end.
