---
firewall_ssh_port: "{{ ssh_port | default(22) }}"
firewall_tailscale_interface: tailscale0
# Extra rules for anything that genuinely needs a LAN-reachable port (e.g. a
# client device that isn't and can't be on the tailnet). Empty by default —
# the public path is all-outbound via cloudflared, so nothing needs to be
# opened for that.
firewall_extra_allow_rules: []
