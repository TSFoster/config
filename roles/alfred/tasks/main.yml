---
- name: Install Alfred
  community.general.homebrew_cask:
    name: "{{ alfred_cask }}"
    state: present
- name: Setup Alfred repo
  ansible.builtin.git:
    repo: "{{ alfred_repo }}"
    dest: "{{ alfred_dir }}"
    version: "{{ alfred_repo_version }}"
    update: false
- name: Set config dir
  community.general.osx_defaults:
    domain: com.runningwithcrayons.Alfred-Preferences
    key: syncfolder
    value: "{{ alfred_dir }}/"
- name: Install Alfred npm packages
  ansible.builtin.include_role:
    name: common
    tasks_from: install_npm_packages
  vars:
    common_packages: "{{ alfred_npm_packages }}"
    common_package_environment: "{{ alfred_npm_environment }}"
