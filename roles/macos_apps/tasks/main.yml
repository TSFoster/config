---
# Guard is also set at the call site in main.yml, but repeated here so the
# role is safe to include from any playbook without platform knowledge.
- name: Install macOS applications
  when: ansible_facts['system'] == 'Darwin'
  block:
    - name: Install macOS GUI applications via Homebrew cask
      community.general.homebrew_cask:
        name: "{{ item }}"
        state: present
        install_options: "appdir={{ homebrew_cask_appdir }}"
        sudo_password: "{{ ansible_become_password }}"
      loop: "{{ macos_apps_casks }}"

    - name: Install Mac App Store applications
      community.general.mas:
        id: "{{ item.id }}"
        state: present
      loop: "{{ macos_apps_mas }}"
      failed_when: false

    - name: Ensure OrbStack docker config directory exists
      ansible.builtin.file:
        path: ~/.orbstack/config
        state: directory
        mode: "0755"
      tags:
        - orbstack

    - name: Configure OrbStack docker daemon defaults
      ansible.builtin.copy:
        dest: ~/.orbstack/config/docker.json
        content: "{{ {'log-driver': docker_daemon_log_driver, 'log-opts': docker_daemon_log_opts} | to_nice_json }}\n"
        mode: "0644"
      tags:
        - orbstack
      # Takes effect on the next engine restart (`orbctl restart docker`) and
      # only for containers created afterwards.

    - name: Ensure Karabiner config directory exists
      ansible.builtin.file:
        dest: "{{ macos_apps_karabiner_config_dir }}"
        state: directory
        mode: "0755"
      tags:
        - karabiner

    - name: Render Karabiner config
      ansible.builtin.template:
        src: karabiner.json.j2
        dest: "{{ macos_apps_karabiner_config_path }}"
        mode: "0644"
      tags:
        - karabiner

    - name: Ensure Xcode FontAndColorThemes directory exists
      ansible.builtin.file:
        path: "~/Library/Developer/Xcode/UserData/FontAndColorThemes"
        state: directory
        mode: "0755"
      tags:
        - xcode

    - name: Download Catppuccin Xcode themes
      ansible.builtin.get_url:
        url: "{{ item.url }}"
        dest: "~/Library/Developer/Xcode/UserData/FontAndColorThemes/{{ item.name }}"
        mode: "0644"
      loop:
        - url: "https://raw.githubusercontent.com/catppuccin/xcode/main/themes/Catppuccin%20Latte.xccolortheme"
          name: "Catppuccin Latte.xccolortheme"
        - url: "https://raw.githubusercontent.com/catppuccin/xcode/main/themes/Catppuccin%20Mocha.xccolortheme"
          name: "Catppuccin Mocha.xccolortheme"
      tags:
        - xcode
