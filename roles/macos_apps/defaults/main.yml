---
macos_apps_karabiner_config_dir: "{{ config_dir }}/karabiner"
macos_apps_karabiner_config_path: "{{ macos_apps_karabiner_config_dir }}/karabiner.json"

# Homebrew casks — GUI applications, macOS only.
# These are installed via community.general.homebrew_cask, not install_packages.
# Cask upgrades are out of scope — run `brew upgrade --cask` manually if needed.
macos_apps_casks:
  # Terminals
  - ghostty

  # Browsers
  - firefox@developer-edition
  - google-chrome@dev
  - opera-developer

  # Productivity
  - 1password
  - keyboard-maestro
  - hazel
  - choosy
  - openinterminal
  - homerow

  # Design
  - affinity
  - sf-symbols

  # Media
  - calibre
  - imageoptim
  - yattee
  - transmission-remote-gui

  # Utilities
  - karabiner-elements
  - utm
  - vyprvpn
  - setapp
  - swiftdefaultappsprefpane
  - bookmacster
  - thingsmacsandboxhelper
  - keybase
  - syntax-highlight
  - zoom

  # Gaming
  - steam
  - 8bitdo-ultimate-software
  - 8bitdo-firmware-updater

  # Developer GUI
  - docker

# Mac App Store apps — requires `mas` CLI (installed in dev_tools)
macos_apps_mas:
  - { id: 1365531024, name: "1Blocker" }
  - { id: 1435957248, name: "Drafts" }
  - { id: 414568915, name: "Key Codes" }
  - { id: 441258766, name: "Magnet" }
  - { id: 639968404, name: "Parcel" }
  - { id: 1529448980, name: "Reeder Classic" }
  - { id: 693112260, name: "Sim Daltonism" }
  - { id: 904280696, name: "Things 3" }
  - { id: 1480933944, name: "Vimari" }
