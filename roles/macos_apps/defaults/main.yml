  - ghostty

  # Browsers
  - firefox@developer-edition
  - google-chrome@dev
  - opera-developer

  # Productivity
  - 1password
  - keyboard-maestro
  - hazel
  - choosy
  - openinterminal
  - homerow

  # Design
