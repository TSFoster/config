---
- name: Install Homebrew font casks
  community.general.homebrew_cask:
    name: "{{ item }}"
    state: present
    sudo_password: "{{ ansible_become_password }}"
  loop: "{{ fonts_homebrew_casks }}"

- name: Get list of fonts available to install via iCloud Drive # TODO Separate out fonts that I actaully want installed
  ansible.builtin.find:
    paths: "{{ fonts_icloud_source_dir }}"
    recurse: true
    patterns: "*.otf"
  register: fonts_icloud_fonts
- name: Install fonts
  ansible.builtin.copy:
    remote_src: true
    src: "{{ item }}"
    dest: "{{ fonts_install_dir }}/"
    mode: "0644"
  loop: "{{ fonts_icloud_fonts.files | map(attribute='path') }}"
