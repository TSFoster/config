# roles/dev_tools/tasks/main.yml
---
- name: Install dev tool packages
  ansible.builtin.include_role:
    name: common
    tasks_from: install_packages
  vars:
    common_packages: "{{ dev_tools_packages }}"

- name: Install dev tool Python packages
  ansible.builtin.include_role:
    name: common
    tasks_from: install_pip_packages
  vars:
    common_packages: "{{ dev_tools_pip_packages }}"

- name: Symlink JDK
  ansible.builtin.file:
    src: /opt/homebrew/opt/openjdk/libexec/openjdk.jdk
    dest: /Library/Java/JavaVirtualMachines/openjdk.jdk
    state: link
  become: true
  when: ansible_facts["system"] == "Darwin"

- name: Check svn extension exists
  ansible.builtin.stat:
    path: /opt/homebrew/lib/libsvnjavahl-1.dylib
  register: dev_tools_java_svn_extension
  when: ansible_facts["system"] == "Darwin"

- name: Symlink svn extension
  ansible.builtin.file:
    src: /opt/homebrew/lib/libsvnjavahl-1.dylib
    dest: /Library/Java/Extensions/libsvnjavahl-1.dylib
    state: link
  become: true
  when: ansible_facts["system"] == "Darwin" and dev_tools_java_svn_extension.stat.exists

- name: Check whether npm is available
  ansible.builtin.command:
    cmd: sh -lc "command -v npm"
  register: dev_tools_npm_command
  changed_when: false
  failed_when: false

- name: Install global npm packages
  ansible.builtin.include_role:
    name: common
    tasks_from: install_npm_packages
  vars:
    common_packages: "{{ dev_tools_npm_packages }}"
    common_package_environment: "{{ asdf_runtime_environment }}"
  when: dev_tools_npm_command.rc == 0

- name: Warn when npm packages are skipped
  ansible.builtin.debug:
    msg: >-
      Skipping dev_tools npm packages because npm is not on PATH.
      Install Node.js first so the asdf npm shim is available.
  when: dev_tools_npm_command.rc != 0
