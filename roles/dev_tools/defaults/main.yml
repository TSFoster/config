# roles/dev_tools/defaults/main.yml
---
dev_tools_npm_environment: "{{ asdf_runtime_environment }}"
dev_tools_homebrew_openjdk_jdk_path: /opt/homebrew/opt/openjdk/libexec/openjdk.jdk
dev_tools_java_virtual_machines_jdk_path: /Library/Java/JavaVirtualMachines/openjdk.jdk
dev_tools_homebrew_svn_extension_path: /opt/homebrew/lib/libsvnjavahl-1.dylib
dev_tools_java_extensions_svn_extension_path: /Library/Java/Extensions/libsvnjavahl-1.dylib

dev_tools_packages:
  # Version control
  - name: git
  - name: gh # GitHub CLI — available via apt on Ubuntu 22.04+
  - name: glab # GitLab CLI
  - name: tig # git TUI
  - name: icdiff

  # Mac App Store CLI — macOS only, must be present before macos_apps role
  - brew: mas

  # Search & filter
  - name: ripgrep
  - brew: fd
    pkg: fd-find # Ubuntu apt name differs from brew
  - name: fzf
  - name: bat

  # JSON / data
  - name: jq
  - name: fx

  # Web / HTTP
  - name: curl
  - name: httpie
  - name: nmap
  - name: mosh
  - name: telnet # macOS no longer ships telnet; same name via brew and apt

  # Text / document
  - name: pandoc
  - name: par
  - brew: poppler
    pkg: poppler-utils
  - name: rename

  # Build / media
  - name: chafa
  - name: ffmpeg
  - name: imagemagick
  - name: qrencode
  - name: svn # required by some font cask installs

  # Monitoring / disk
  - name: ncdu
  - name: pv
  - brew: trash # macOS: safe rm — no direct apt equivalent
  - name: fswatch
  - name: wrk # HTTP benchmarking

  # Security
  - name: gnupg
  - name: mkcert

  # Containers / DevOps
  - name: podman
  - name: skopeo
  - brew: dive # Docker image explorer — no standard apt package
  - brew: diffoci
  - brew: doctl # DigitalOcean CLI

  # Language-adjacent tooling
  - brew: openjdk
    pkg: default-jdk # Ubuntu: installs the default OpenJDK version
  - name: python3

  # Misc dev tools
  - name: shellcheck
  - name: yamllint
  - name: exercism
  - name: watchexec
  - brew: yazi # Linux package availability varies; install via brew where managed
  - name: cloc
  - name: hugo
  - brew: terminal-notifier # macOS-only notification tool
  - name: rlwrap
  - brew: lorem # macOS-only Lorem Ipsum generator
  - name: gperf
  - brew: libusb
    pkg: libusb-dev
  - brew: libuv
    pkg: libuv1-dev

  # Database
  - name: postgresql@18
  - name: sqlite
  - brew: pgcli
  - brew: mycli
  - brew: litecli

  # Code analysis / formatting
  - brew: efm-langserver # no standard apt package

  # HTML
  - brew: tidy-html5
    pkg: tidy

  # LLMs
  - brew: antigravity
  - brew: antigravity-ide
  - brew: antigravity-cli
  - brew: chatgpt
  - brew: claude
  - brew: claude-code
  - brew: codex-app
  - brew: apfel

# Global npm packages that belong to the dev_tools concern.
# Note: neovim (Node.js neovim client) lives in the nvim role.
# Note: alfred-fkill lives in the alfred role.
dev_tools_npm_packages:
  - curlconverter
  - firebase-tools
  - hostile
  - machine-share
  - netlify-cli
  - vercel
  - "@openai/codex"
  - react-devtools

# Global Python packages that belong to the dev_tools concern.
dev_tools_pip_packages:
  - ansible
  - ansible-core
  - ansible-compat
  - ansible-lint
