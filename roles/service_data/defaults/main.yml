---
service_data_group: svc
# Deliberately above 1000: GIDs below 1000 are the system/dynamic range
# (systemd-sysusers claims them on boot, e.g. systemd-network landed on
# 998 here), so a fixed low GID risks colliding with a service group
# that didn't exist yet when this was picked.
service_data_group_gid: 2000

# Every path a service might store data under, whether or not anything
# actually shares it today — group svc gets set up front so a new service
# can just opt in with PGID/group_add: [2000] later without a separate
# Ansible change per service. Covers both ways a service ends up with data
# on this host:
#   - a plain Docker named volume, which Docker places under
#     /var/lib/docker/volumes/**/_data — the default, and what most
#     services should use
#   - an explicit host path a service bind-mounts instead (e.g. because
#     more than one service's compose project needs to read/write the same
#     files) — external_mounts (removable drives, see roles/external_mounts)
#     and internal_data_paths (always-attached, under /srv — see host_vars
#     for this host) together
#
# This does widen what group svc's members (i.e. docker_user, who already
# has root-equivalent access via the docker group) can read on the host —
# named-volume data that was never intended to be "shared" also becomes
# group-readable/writable once its parent inherits svc via setgid. Fine
# for a single-admin box; worth revisiting if that stops being true.
service_data_paths: >-
  {{ (external_mounts | default([]) | map(attribute='path') | list)
     + (internal_data_paths | default([]))
     + ['/var/lib/docker/volumes'] }}
