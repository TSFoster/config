---
- name: Create ~/.local directory structure
  ansible.builtin.file:
    state: directory
    dest: "{{ ansible_facts['env']['HOME'] }}/.local/{{ item }}"
  loop:
    - bin
    - cache
    - lib
    - share
    - state
- name: Add bin files
  ansible.builtin.copy:
    src: mailbox-count
    dest: "~/.local/bin/"
    mode: "u+rwx"
  when: ansible_facts["system"] == "Darwin"
- name: Add ghostty config
  ansible.builtin.template:
    src: ghostty.toml.j2
    dest: "{{ config_dir }}/ghostty/config"
- name: Add gh config
  ansible.builtin.copy:
    src: gh
    dest: "{{ config_dir }}/"
- name: Add yazi config
  ansible.builtin.copy:
    src: yazi
    dest: "{{ config_dir }}/"
- name: Add git config
  block:
    - name: Copy config
      ansible.builtin.copy:
        src: git
        dest: "{{ config_dir }}/"
    - name: Add git credentials
      ansible.builtin.template:
        src: credentials.gitconfig.j2
        dest: "{{ config_dir }}/git/credentials.gitconfig"
- name: Add editorconfig
  ansible.builtin.copy:
    src: editorconfig
    dest: ~/.editorconfig
- name: Add warpd config
  ansible.builtin.copy:
    src: warpd
    dest: "{{ config_dir }}/warpd/config"
    mode: "u+rw"
