# roles/nvim/defaults/main.yml
---
nvim_ruby_environment: "{{ homebrew_ruby_environment }}"
nvim_npm_environment: "{{ asdf_runtime_environment }}"
nvim_config_dir: "{{ config_dir }}/nvim"
nvim_fish_completions_dir: "{{ config_dir }}/fish/completions"
nvim_fish_completion_path: "{{ nvim_fish_completions_dir }}/nvr.fish"

# Packages without `pkg:` are macOS-only (no standard apt equivalent).
# They are silently skipped on Linux by the install_packages abstraction.
nvim_packages:
  - brew: deno # no standard apt package
  - brew: gopls # Go LSP; on Linux install via `go install golang.org/x/tools/gopls@latest`
  - brew: lua-language-server # no apt package
  - brew: marksman # no apt package
  - name: rust-analyzer # available in Ubuntu 22.04+ apt
  - brew: stylua # Lua formatter; no apt package

# npm-based LSP servers and tools — installed globally via npm (asdf-managed).
# Includes the Node.js neovim provider, migrated here from the old npm role.
nvim_npm_packages:
  - neovim
  - "@agentclientprotocol/claude-agent-acp" # ACP bridge binary CodeCompanion's claude_code adapter spawns
  - "@ansible/ansible-language-server"
  - "@fsouza/prettierd"
  - bash-language-server
  - dockerfile-language-server-nodejs
  - "@olrtg/emmet-language-server"
  - prettier
  - pyright
  - "@tailwindcss/language-server"
  - tree-sitter-cli
  - typescript
  - typescript-language-server
  - vscode-langservers-extracted
  - yaml-language-server

# Ruby gems — use Homebrew-managed Ruby on macOS.
# On Linux, system Ruby is used; the gem tasks are guarded to Darwin
# because the current PATH setup uses the Homebrew Ruby path.
nvim_gem_packages:
  - solargraph
  - neovim

nvim_python_module_packages:
  - pynvim
  - neovim-remote
