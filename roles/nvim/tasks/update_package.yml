---
- name: Resolve selected Neovim vim.pack packages to update
  ansible.builtin.include_tasks: _resolve_selected_packages.yml
  vars:
    nvim_pack_requested_packages: "{{ packages_to_update | default(omit) }}"
    nvim_pack_requested_packages_required: false
    nvim_pack_requested_packages_fail_msg: ""
    nvim_pack_requested_packages_normalized_fail_msg: ""

- name: Update Neovim vim.pack packages
  ansible.builtin.command:
    argv:
      - nvim
      - --headless
      - >-
        +lua vim.pack.update({{ nvim_pack_package_names_lua if (nvim_pack_requested_package_names | length > 0) else 'nil' }}, { force = true })
      - +qa
  when: (nvim_pack_requested_package_names | length == 0) or nvim_pack_should_run
  changed_when: (nvim_pack_requested_package_names | length == 0) or nvim_pack_should_run
