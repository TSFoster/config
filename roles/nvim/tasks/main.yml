---
- name: Install python neovim module # TODO Check present in default-node-packages?
  ansible.builtin.include_role:
    name: common
    tasks_from: install_pip_packages
  vars:
    common_packages: "{{ nvim_python_module_packages }}"
- name: Install ruby neovim module # TODO Check present in default-ruby-packages?
  ansible.builtin.include_role:
    name: common
    tasks_from: install_gem_packages
  vars:
    common_packages:
      - neovim
    common_package_environment: "{{ homebrew_ruby_environment }}"
  when: ansible_facts['system'] == 'Darwin'
- name: Install Neovim LSP tool packages
  ansible.builtin.include_role:
    name: common
    tasks_from: install_packages
  vars:
    common_packages: "{{ nvim_packages }}"

- name: Install Neovim npm packages
  ansible.builtin.include_role:
    name: common
    tasks_from: install_npm_packages
  vars:
    common_packages: "{{ nvim_npm_packages }}"
    common_package_environment: "{{ asdf_runtime_environment }}"
  tags:
    - nvim_lsp

- name: Install Neovim Ruby gem packages
  ansible.builtin.include_role:
    name: common
    tasks_from: install_gem_packages
  vars:
    common_packages: "{{ nvim_gem_packages }}"
  tags:
    - nvim_lsp

- name: Install neovim-remote
  ansible.builtin.include_role:
    name: common
    tasks_from: install_pip_packages
  vars:
    common_packages: "{{ nvim_nvr_packages }}"
  tags:
    - nvr

- name: Copy files
  ansible.builtin.copy:
    src: ./
    dest: "{{ config_dir }}/nvim/"
    mode: preserve
  tags:
    - nvim_files
- name: Add nvr completion in fish
  tags:
    - nvr
  block:
    - name: Ensure fish completions directory exists
      ansible.builtin.file:
        path: "{{ config_dir }}/fish/completions"
        state: directory
        mode: "0755"
    - name: Download nvr fish completion
      ansible.builtin.get_url:
        url: https://raw.githubusercontent.com/mhinz/neovim-remote/master/contrib/completion.fish
        dest: "{{ config_dir }}/fish/completions/nvr.fish"
        mode: "0644"
        force: false
