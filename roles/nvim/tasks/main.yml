---
- name: Install python neovim module # TODO Check present in default-node-packages?
  ansible.builtin.pip:
    name: pynvim
    state: present
- name: Install ruby neovim module # TODO Check present in default-ruby-packages?
  community.general.gem:
    name: neovim
    state: present
  environment:
    PATH: "{{ homebrew_prefix }}/opt/ruby/bin:{{ ansible_facts['env']['PATH'] }}"
- name: Install npm neovim module # TODO Check present in default-node-packages?
  community.general.npm:
    name: neovim
    global: true
    state: present
- name: Find npm
  ansible.builtin.command:
    cmd: asdf which npm
  register: nvim_npm_location
  changed_when: false
- name: Install npm language servers for Neovim
  community.general.npm:
    name: "{{ item }}"
    global: true
    state: present
    executable: "{{ nvim_npm_location.stdout }}"
  loop: "{{ nvim_lsp_npm_packages }}"
  tags:
    - nvim_lsp
- name: Check default npm packages for Neovim language servers
  ansible.builtin.lineinfile:
    path: "{{ config_dir }}/asdf/default-npm-packages"
    line: "{{ item }}"
    state: present
    create: true
    mode: "0644"
  loop: "{{ nvim_lsp_npm_packages }}"
  tags:
    - nvim_lsp
- name: Install Homebrew language servers for Neovim
  community.general.homebrew:
    name: "{{ nvim_lsp_homebrew_packages_darwin }}"
    state: present
  when: ansible_facts["system"] == "Darwin"
  tags:
    - nvim_lsp
- name: Install gem language servers for Neovim
  community.general.gem:
    name: "{{ item }}"
    state: present
  environment:
    PATH: "{{ homebrew_prefix }}/opt/ruby/bin:{{ ansible_facts['env']['PATH'] }}"
  loop: "{{ nvim_lsp_gem_packages }}"
  tags:
    - nvim_lsp
- name: Check default gems for Neovim language servers
  ansible.builtin.lineinfile:
    path: "{{ config_dir }}/asdf/default-gems"
    line: "{{ item }}"
    state: present
    create: true
    mode: "0644"
  loop: "{{ nvim_lsp_gem_packages }}"
  tags:
    - nvim_lsp
- name: Install neovim-remote # TODO Check present in default-python-packages?
  ansible.builtin.pip:
    name: neovim-remote
    state: present
  tags:
    - nvr
- name: Copy files
  ansible.builtin.copy:
    src: ./
    dest: "{{ config_dir }}/nvim/"
    mode: preserve
  tags:
    - nvim_files
- name: Add nvr completion in fish
  block:
    - name: Ensure fish completions directory exists
      ansible.builtin.file:
        path: "{{ config_dir }}/fish/completions"
        state: directory
        mode: "0755"
    - name: Download nvr fish completion
      ansible.builtin.get_url:
        url: https://raw.githubusercontent.com/mhinz/neovim-remote/master/contrib/completion.fish
        dest: "{{ config_dir }}/fish/completions/nvr.fish"
        mode: "0644"
        force: false
  tags:
    - nvr
