---
- name: Install python neovim module
  ansible.builtin.include_role:
    name: common
    tasks_from: install_pip_packages
  vars:
    common_packages: "{{ nvim_python_module_packages }}"

- name: Uninstall Neovim vim.pack packages
  ansible.builtin.include_tasks: uninstall_package.yml
  when: "'nvim_pack_uninstall' in ansible_run_tags"
  tags:
    - never
    - nvim_pack_uninstall

- name: Update Neovim vim.pack packages
  ansible.builtin.include_tasks: update_package.yml
  when: "'nvim_pack_update' in ansible_run_tags"
  tags:
    - never
    - nvim_pack_update

- name: List Neovim vim.pack packages
  ansible.builtin.include_tasks: list_package.yml
  when: "'nvim_pack_list' in ansible_run_tags"
  tags:
    - never
    - nvim_pack_list

- name: Install ruby neovim module
  ansible.builtin.include_role:
    name: common
    tasks_from: install_gem_packages
  vars:
    common_packages:
      - neovim
    common_package_environment: "{{ nvim_ruby_environment }}"
  when: ansible_facts['system'] == 'Darwin'
- name: Install Neovim LSP tool packages
  ansible.builtin.include_role:
    name: common
    tasks_from: install_packages
  vars:
    common_packages: "{{ nvim_packages }}"

- name: Install Neovim npm packages
  ansible.builtin.include_role:
    name: common
    tasks_from: install_npm_packages
  vars:
    common_packages: "{{ nvim_npm_packages }}"
    common_package_environment: "{{ nvim_npm_environment }}"
  tags:
    - nvim_lsp

- name: Install Neovim Ruby gem packages
  ansible.builtin.include_role:
    name: common
    tasks_from: install_gem_packages
  vars:
    common_packages: "{{ nvim_gem_packages }}"
  tags:
    - nvim_lsp

- name: Sync Neovim files except pack lockfile
  ansible.posix.synchronize:
    src: "{{ role_path }}/files/"
    dest: "{{ nvim_config_dir }}/"
    recursive: true
    links: true
    delete: true
    rsync_opts:
      - "--exclude=nvim-pack-lock.json"
  tags:
    - nvim_files

- name: Symlink Neovim pack lockfile
  ansible.builtin.file:
    src: "{{ role_path }}/files/nvim-pack-lock.json"
    dest: "{{ nvim_config_dir }}/nvim-pack-lock.json"
    state: link
    force: true
  tags:
    - nvim_files

- name: Copy default prettierrc.json to home directory
  ansible.builtin.copy:
    src: "{{ role_path }}/files/prettierrc.json"
    dest: "{{ ansible_env.HOME }}/.prettierrc.json"
    mode: "0644"
  tags:
    - nvim_files

- name: Add nvr completion in fish
  block:
    - name: Ensure fish completions directory exists
      ansible.builtin.file:
        path: "{{ nvim_fish_completions_dir }}"
        state: directory
        mode: "0755"
    - name: Download nvr fish completion
      ansible.builtin.get_url:
        url: https://raw.githubusercontent.com/mhinz/neovim-remote/master/contrib/completion.fish
        dest: "{{ nvim_fish_completion_path }}"
        mode: "0644"
        force: false
