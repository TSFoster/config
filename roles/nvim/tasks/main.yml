---
- name: Install python neovim module # TODO Check present in default-node-packages?
  ansible.builtin.pip:
    name: pynvim
    state: present
- name: Install ruby neovim module # TODO Check present in default-ruby-packages?
  community.general.gem:
    name: neovim
    state: present
  environment:
    PATH: "{{ homebrew_prefix }}/opt/ruby/bin:{{ ansible_facts['env']['PATH'] }}"
  when: ansible_facts['system'] == 'Darwin'
- name: Install Neovim LSP tool packages
  ansible.builtin.include_role:
    name: common
    tasks_from: install_packages
  vars:
    packages: "{{ nvim_packages }}"

- name: Install Neovim npm packages
  community.general.npm:
    name: "{{ item }}"
    global: true
    state: present
  loop: "{{ nvim_npm_packages }}"

- name: Check default npm packages for Neovim language servers
  ansible.builtin.lineinfile:
    path: "{{ config_dir }}/asdf/default-npm-packages"
    line: "{{ item }}"
    state: present
    create: true
    mode: "0644"
  loop: "{{ nvim_npm_packages }}"
  tags:
    - nvim_lsp
# Gem tasks use Homebrew-managed Ruby PATH and are macOS-only for now.
# To support Linux, replace the environment PATH with the system Ruby path.
- name: Install Neovim Ruby gem packages (macOS only)
  community.general.gem:
    name: "{{ item }}"
    state: present
  environment:
    PATH: "{{ homebrew_prefix }}/opt/ruby/bin:{{ ansible_env.PATH }}"
  loop: "{{ nvim_gem_packages }}"
  when: ansible_facts['system'] == 'Darwin'
- name: Check default gems for Neovim language servers
  ansible.builtin.lineinfile:
    path: "{{ config_dir }}/asdf/default-gems"
    line: "{{ item }}"
    state: present
    create: true
    mode: "0644"
  loop: "{{ nvim_gem_packages }}"
  tags:
    - nvim_lsp
  when: ansible_facts['system'] == 'Darwin'
- name: Install neovim-remote # TODO Check present in default-python-packages?
  ansible.builtin.pip:
    name: neovim-remote
    state: present
  tags:
    - nvr
- name: Copy files
  ansible.builtin.copy:
    src: ./
    dest: "{{ config_dir }}/nvim/"
    mode: preserve
  tags:
    - nvim_files
- name: Add nvr completion in fish
  block:
    - name: Ensure fish completions directory exists
      ansible.builtin.file:
        path: "{{ config_dir }}/fish/completions"
        state: directory
        mode: "0755"
    - name: Download nvr fish completion
      ansible.builtin.get_url:
        url: https://raw.githubusercontent.com/mhinz/neovim-remote/master/contrib/completion.fish
        dest: "{{ config_dir }}/fish/completions/nvr.fish"
        mode: "0644"
        force: false
  tags:
    - nvr
