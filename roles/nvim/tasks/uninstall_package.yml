---
- name: Resolve Neovim vim.pack packages to uninstall
  ansible.builtin.include_tasks: _resolve_selected_packages.yml
  vars:
    nvim_pack_requested_packages: "{{ packages_to_uninstall }}"
    nvim_pack_requested_packages_required: true
    nvim_pack_requested_packages_fail_msg: >-
      uninstall_package requires `packages_to_uninstall` as either a package
      name string or a non-empty list of package names.
    nvim_pack_requested_packages_normalized_fail_msg: >-
      uninstall_package requires at least one non-empty package name after
      normalization.

- name: Remove Neovim vim.pack packages from disk
  ansible.builtin.command:
    argv:
      - nvim
      - --clean
      - --headless
      - +lua vim.opt.packpath:append(vim.fn.stdpath('data') .. '/site'); vim.pack.del({{ nvim_pack_package_names_lua }})
      - +qa
  when: nvim_pack_should_run
  changed_when: nvim_pack_should_run
