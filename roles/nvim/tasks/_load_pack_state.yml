---
- name: Check for Neovim vim.pack lockfile
  ansible.builtin.stat:
    path: "{{ nvim_config_dir }}/nvim-pack-lock.json"
  register: nvim_pack_lockfile_stat
  changed_when: false

- name: Assert Neovim vim.pack lockfile exists
  ansible.builtin.assert:
    that:
      - nvim_pack_lockfile_stat.stat.exists
    fail_msg: >
      Expected Neovim vim.pack lockfile at {{ nvim_config_dir }}/nvim-pack-lock.json.
  changed_when: false

- name: Read Neovim vim.pack lockfile
  ansible.builtin.slurp:
    src: "{{ nvim_config_dir }}/nvim-pack-lock.json"
  register: nvim_pack_lockfile
  changed_when: false

- name: Capture Neovim vim.pack state
  ansible.builtin.set_fact:
    nvim_pack_lockfile_plugin_names: >-
      {{
        ((nvim_pack_lockfile.content | b64decode | from_json).plugins | default({}))
        .keys()
        | list
      }}
    nvim_pack_root: >-
      {{
        ansible_facts['env'].get('XDG_DATA_HOME', ansible_facts['env']['HOME'] ~ '/.local/share')
      }}/nvim/site/pack/core/opt
  changed_when: false
