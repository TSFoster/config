---
ssh_dir: "{{ ansible_facts['env']['HOME'] }}/.ssh"
ssh_config_dir: "{{ ssh_dir }}/config.d"
ssh_config_path: "{{ ssh_dir }}/config"
ssh_user: "{{ ansible_facts['env']['USER'] }}"
ssh_op_command: op
# Skip 1Password "SSH Key" items tagged with this — their public key won't
# be fetched into ~/.ssh or added to authorized_keys.
ssh_exclude_pub_tag: exclude-pub
# 1Password "Server" items tagged with this are host entries for
# config.d/hosts — title is the Host alias, fields are ssh config keywords
# (Server's built-in "URL"/"username" fields map to HostName/User; the rest
# are custom fields named after the ssh keyword directly).
ssh_host_tag: ssh-host
# 1Password field label -> ssh config keyword, emitted in this order when present.
ssh_host_config_fields:
  - field: URL
    keyword: HostName
  - field: username
    keyword: User
  - field: Port
    keyword: Port
  - field: IdentityFile
    keyword: IdentityFile
  - field: IdentitiesOnly
    keyword: IdentitiesOnly
  - field: PreferredAuthentications
    keyword: PreferredAuthentications
  - field: ProxyJump
    keyword: ProxyJump
  - field: ProxyCommand
    keyword: ProxyCommand
  - field: ForwardAgent
    keyword: ForwardAgent
  - field: LocalForward
    keyword: LocalForward
  - field: RemoteForward
    keyword: RemoteForward
ssh_identity_agent_darwin_dir: >-
  {{ ansible_facts['env']['HOME'] }}/Library/Group Containers/2BUA8C4S2C.com.1password/t
ssh_identity_agent_linux_dir: "{{ ansible_facts['env']['HOME'] }}/.1password"
ssh_identity_agent_dir: >-
  {{
    (ansible_facts['system'] == 'Darwin')
    | ternary(
      ssh_identity_agent_darwin_dir,
      ssh_identity_agent_linux_dir
    )
  }}
ssh_identity_agent_path: "{{ ssh_identity_agent_dir }}/agent.sock"
