---
- name: Make .ssh dir
  ansible.builtin.file:
    path: "{{ ssh_dir }}"
    state: directory
    mode: "0700"
- name: List SSH Key items in 1Password
  ansible.builtin.command:
    cmd: "{{ ssh_op_command }} item list --categories='SSH Key' --format=json"
  register: ssh_op_item_list
  changed_when: false
- name: Select SSH Key items not tagged "{{ ssh_exclude_pub_tag }}"
  ansible.builtin.set_fact:
    ssh_pub_key_items: "{{ ssh_pub_key_items | default([]) + [op_item] }}"
  loop: "{{ ssh_op_item_list.stdout | from_json }}"
  loop_control:
    loop_var: op_item
    label: "{{ op_item.title }}"
  when: ssh_exclude_pub_tag not in (op_item.tags | default([]))
- name: Fetch public keys from 1Password
  # Only the public half ever touches disk — the private key stays in the
  # 1Password SSH agent, which IdentityAgent below points ssh at.
  ansible.builtin.shell:
    cmd: >-
      {{ ssh_op_command }} read
      "op://{{ op_item.vault.id }}/{{ op_item.id }}/public key"
      > {{ ssh_dir }}/{{ op_item.title | regex_replace('[^A-Za-z0-9_.-]', '_') }}.pub
    creates: "{{ ssh_dir }}/{{ op_item.title | regex_replace('[^A-Za-z0-9_.-]', '_') }}.pub"
  loop: "{{ ssh_pub_key_items | default([]) }}"
  loop_control:
    loop_var: op_item
    label: "{{ op_item.title }}"
- name: Add fetched public keys to authorized_keys
  ansible.posix.authorized_key:
    user: "{{ ssh_user }}"
    state: present
    key: "{{ lookup('file', ssh_dir ~ '/' ~ (op_item.title | regex_replace('[^A-Za-z0-9_.-]', '_')) ~ '.pub') }}"
  loop: "{{ ssh_pub_key_items | default([]) }}"
  loop_control:
    loop_var: op_item
    label: "{{ op_item.title }}"
- name: Make .ssh/config.d dir
  ansible.builtin.file:
    path: "{{ ssh_config_dir }}"
    state: directory
    mode: "0700"
- name: Copy SSH config
  ansible.builtin.template:
    src: "config.j2"
    dest: "{{ ssh_config_path }}"
    mode: "0600"
