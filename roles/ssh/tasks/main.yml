---
- name: Make .ssh dir
  ansible.builtin.file:
    path: "{{ ssh_dir }}"
    state: directory
    mode: "0700"
- name: List all items in 1Password
  # Unfiltered (not --categories/--tags) so this one call covers both SSH
  # Key and SSH host items below — each 1Password-calling task here costs
  # one 1Password approval prompt, so fewer/broader tasks means fewer
  # prompts per playbook run.
  ansible.builtin.command:
    cmd: "{{ ssh_op_command }} item list --format=json"
  register: ssh_op_item_list
  changed_when: false
- name: Select SSH Key items not tagged "{{ ssh_exclude_pub_tag }}"
  ansible.builtin.set_fact:
    ssh_pub_key_items: "{{ ssh_pub_key_items | default([]) + [op_item] }}"
  loop: "{{ ssh_op_item_list.stdout | from_json }}"
  loop_control:
    loop_var: op_item
    label: "{{ op_item.title }}"
  when: >-
    op_item.category == 'SSH_KEY' and
    ssh_exclude_pub_tag not in (op_item.tags | default([]))
- name: Select SSH Key items tagged "{{ ssh_authorized_keys_tag }}"
  ansible.builtin.set_fact:
    ssh_authorized_key_items: "{{ ssh_authorized_key_items | default([]) + [op_item] }}"
  loop: "{{ ssh_op_item_list.stdout | from_json }}"
  loop_control:
    loop_var: op_item
    label: "{{ op_item.title }}"
  when: >-
    op_item.category == 'SSH_KEY' and
    ssh_authorized_keys_tag in (op_item.tags | default([]))
- name: Fail if no SSH Key items are tagged "{{ ssh_authorized_keys_tag }}"
  # authorized_keys below is exclusive — an empty list would wipe it and
  # could lock this account out, so refuse to proceed instead.
  ansible.builtin.assert:
    that: (ssh_authorized_key_items | default([]) | length) > 0
    fail_msg: >-
      No 1Password "SSH Key" items are tagged "{{ ssh_authorized_keys_tag }}";
      refusing to clear authorized_keys.
- name: Fetch public keys for items needing one
  # Only the public half ever touches disk/facts — the private key stays
  # in the 1Password SSH agent, which IdentityAgent below points ssh at.
  # One task fetches for both ssh_pub_key_items (written to {{ ssh_dir }})
  # and ssh_authorized_key_items (folded into authorized_keys below) since
  # the two lists can overlap and each is otherwise its own 1Password
  # approval prompt.
  ansible.builtin.command:
    cmd: >-
      {{ ssh_op_command }} read
      "op://{{ op_item.vault.id }}/{{ op_item.id }}/public key"
  register: ssh_op_pub_key_fetch
  changed_when: false
  loop: >-
    {{
      ((ssh_pub_key_items | default([])) + (ssh_authorized_key_items | default([])))
      | unique(attribute='id')
    }}
  loop_control:
    loop_var: op_item
    label: "{{ op_item.title }}"
- name: Build public key lookup by item ID
  ansible.builtin.set_fact:
    ssh_pub_key_by_id: "{{ ssh_pub_key_by_id | default({}) | combine({op_result.op_item.id: op_result.stdout}) }}"
  loop: "{{ ssh_op_pub_key_fetch.results }}"
  loop_control:
    loop_var: op_result
    label: "{{ op_result.op_item.title }}"
- name: Write public keys fetched from 1Password
  ansible.builtin.copy:
    content: "{{ ssh_pub_key_by_id[op_item.id] }}\n"
    dest: "{{ ssh_dir }}/{{ op_item.title | regex_replace('[^A-Za-z0-9_.-]', '_') }}.pub"
    mode: "0644"
  loop: "{{ ssh_pub_key_items | default([]) }}"
  loop_control:
    loop_var: op_item
    label: "{{ op_item.title }}"
- name: Set authorized_keys to exactly the fetched keys
  ansible.posix.authorized_key:
    user: "{{ ssh_user }}"
    state: present
    exclusive: true
    key: >-
      {{
        ssh_authorized_key_items
        | map(attribute='id')
        | map('extract', ssh_pub_key_by_id)
        | join('\n')
      }}
- name: Make .ssh/config.d dir
  ansible.builtin.file:
    path: "{{ ssh_config_dir }}"
    state: directory
    mode: "0700"
- name: Select SSH host items
  ansible.builtin.set_fact:
    ssh_host_items: "{{ ssh_host_items | default([]) + [op_item] }}"
  loop: "{{ ssh_op_item_list.stdout | from_json }}"
  loop_control:
    loop_var: op_item
    label: "{{ op_item.title }}"
  when: ssh_host_tag in (op_item.tags | default([]))
- name: Fetch full details for each SSH host item
  ansible.builtin.command:
    cmd: "{{ ssh_op_command }} item get {{ op_item.id }} --format=json"
  register: ssh_op_host_details
  changed_when: false
  loop: "{{ ssh_host_items | default([]) }}"
  loop_control:
    loop_var: op_item
    label: "{{ op_item.title }}"
- name: Copy SSH config
  ansible.builtin.template:
    src: "config.j2"
    dest: "{{ ssh_config_path }}"
    mode: "0600"
- name: Copy per-host SSH config files
  # No backup:true — "Include config.d/*" below globs every file in this
  # dir, so a leftover *.PID.timestamp~ backup would get parsed as SSH
  # config too. 1Password is the source of truth if a render needs undoing.
  ansible.builtin.template:
    src: "host.j2"
    dest: "{{ ssh_config_dir }}/hosts-{{ op_host.title | regex_replace('[^A-Za-z0-9_.-]', '_') }}"
    mode: "0600"
  vars:
    host:
      title: "{{ op_host.title }}"
      fields: "{{ op_host.fields | selectattr('value', 'defined') | list | items2dict(key_name='label', value_name='value') }}"
  loop: "{{ ssh_op_host_details.results | map(attribute='stdout') | map('from_json') | list }}"
  loop_control:
    loop_var: op_host
    label: "{{ op_host.title }}"
- name: Remove old single-file SSH host config
  # Superseded by the per-host hosts-NAME files above.
  ansible.builtin.file:
    path: "{{ ssh_config_dir }}/hosts"
    state: absent
- name: Find existing per-host SSH config files
  ansible.builtin.find:
    paths: "{{ ssh_config_dir }}"
    patterns: "hosts-*"
  register: ssh_existing_host_files
- name: Remove stale per-host SSH config files
  # A host removed or renamed in 1Password otherwise leaves its old
  # hosts-NAME file behind, since each host now templates to its own file
  # instead of one file being fully regenerated each run.
  ansible.builtin.file:
    path: "{{ stale_host_file }}"
    state: absent
  loop: >-
    {{
      ssh_existing_host_files.files | map(attribute='path') | list
      | difference(
          ssh_op_host_details.results
          | map(attribute='stdout') | map('from_json') | map(attribute='title')
          | map('regex_replace', '[^A-Za-z0-9_.-]', '_')
          | map('regex_replace', '^(.*)$', ssh_config_dir ~ '/hosts-\1')
          | list
        )
    }}
  loop_control:
    loop_var: stale_host_file
