---
- name: Install global packages
  community.general.npm:
    name: "{{ item }}"
    global: true
    state: present
  loop: "{{ npm_plugins }}"
- name: Check default npm packages
  ansible.builtin.lineinfile:
    path: "{{ config_dir }}/asdf/default-npm-packages"
    line: "{{ item }}"
    state: present
    create: true
    mode: "0644"
  loop: "{{ npm_plugins }}"
