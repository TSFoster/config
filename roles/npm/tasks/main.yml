---
- name: Find npm
  ansible.builtin.command:
    cmd: asdf which npm
  register: npm_location
  changed_when: no
- name: Install global packages
  community.general.npm:
    name: "{{ item }}"
    global: yes
    state: present
    executable: "{{ npm_location.stdout }}"
  loop: "{{ npm_plugins }}"
- name: Check default npm packages
  ansible.builtin.lineinfile:
    path: "{{ config_dir }}/asdf/default-npm-packages"
    line: "{{ item }}"
    state: present
    create: yes
  loop: "{{ npm_plugins }}"
