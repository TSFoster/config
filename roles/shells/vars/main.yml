---
fisher_plugins:
  - TSFoster/posix-source
  - TSFoster/docker-tools
  - TSFoster/fish-elm-completion
  - fisherman/getopts
  - catppuccin/fish
  - jethrokuan/fzf
  - topdroplabs/docker-fish-completion
shell_path_entries_interactive:
  - bin
  - node_modules/.bin
shell_path_entries:
  - /usr/local/bin
  - /usr/local/sbin
  - "{{ ansible_facts['env']['HOME'] }}/.local/bin"
  - "{{ ansible_facts['env']['HOME'] }}/.cargo/bin"
  - "{{ ansible_facts['env']['HOME'] }}/.local/share/go/bin"
shell_path_entries_darwin:
  - "{{ homebrew_cask_appdir }}/opt/openjdk/bin"
  - /Applications/Setapp/Soulver.app/Contents/MacOS/CLI
_uv:
  xdg_data: "{{ ansible_facts['env']['HOME'] }}/.local/share"
  fd_default: --exclude node_modules --exclude .git --exclude elm-stuff --exclude bower_components --exclude target --exclude .DS_Store --exclude .sass-cache --hidden
  iCloud: "{{ ansible_facts['env']['HOME'] }}/Library/Mobile Documents/com~apple~CloudDocs"
  isMac: "{{ ansible_facts['system'] == 'Darwin' }}"
  editor: "zmx attach nvim-(random) nvim"
  shell_path_entries: "{{ shell_path_entries + (lookup('vars', 'shell_path_entries_' + (ansible_facts['system'] | lower)) | default([])) }}"
  shell_path_entries_interactive: "{{ shell_path_entries_interactive }}"
shell_variables:
  - name: PAGER
    value: less # TODO nvr/nvim +Man!
    export: yes
  - name: XDG_CONFIG_HOME
    value: "{{ config_dir }}"
    export: yes
  - name: XDG_DATA_HOME
    value: "{{ _uv.xdg_data }}"
    export: yes
  - name: XDG_CACHE_HOME
    value: "{{ ansible_facts['env']['HOME'] }}/.local/cache"
    export: yes
  - name: XDG_STATE_HOME
    value: "{{ ansible_facts['env']['HOME'] }}/.local/state"
    export: yes
  - name: GOPATH
    value: "{{ _uv.xdg_data }}/go"
    export: yes
  - name: HOMEBREW_CASK_OPTS
    value: "{{ _uv.isMac | ternary('--appdir=' + homebrew_cask_appdir, omit) }}"
    export: yes
  - name: FD_DEFAULT_FLAGS
    value: "{{ _uv.fd_default }}"
    export: yes
  - name: RIPGREP_CONFIG_PATH
    value: "{{ config_dir }}/ripgreprc"
    export: yes
  - name: FZF_DEFAULT_COMMAND
    value: "fd --type file {{ _uv.fd_default }}"
    export: yes
  - name: ASDF_DATA_DIR
    value: "{{ ansible_facts['env']['HOME'] }}/.asdf"
    export: yes
  - name: ASDF_PYTHON_DEFAULT_PACKAGES_FILE
    value: "{{ config_dir }}/asdf/default-python-packages"
    export: yes
  - name: ASDF_GEM_DEFAULT_PACKAGES_FILE
    value: "{{ config_dir }}/asdf/default-gems"
    export: yes
  - name: ASDF_NPM_DEFAULT_PACKAGES_FILE
    value: "{{ config_dir }}/asdf/default-npm-packages"
    export: yes
  - name: EDITOR
    value: "{{ _uv.editor }}"
    export: yes
  - name: config
    export: yes
    value: "{{ config_dir }}"
  - name: data
    export: yes
    value: "{{ _uv.xdg_data }}"
  - name: workspace
    export: yes
    value: "{{ ansible_facts['env']['HOME'] }}/workspace"
  - name: OS
    value: "{{ _uv.isMac | ternary('Mac', 'Other') }}"
  - name: iCloud
    export: yes
    value: "{{ _uv.isMac | ternary(_uv.iCloud, omit) }}"
  - name: documents
    export: yes
    value: "{{ _uv.isMac | ternary(_uv.iCloud + '/Documents', omit) }}"
  - name: work
    export: yes
    value: "{{ _uv.isMac | ternary(_uv.iCloud + '/Documents/Work', omit) }}"
  - name: clients
    export: yes
    value: "{{ _uv.isMac | ternary(_uv.iCloud + '/Documents/Work/Clients', omit) }}"
fish_universal_variables:
  - name: fish_user_paths
    value_multiple: "{{ _uv.shell_path_entries }}"
    export: yes
    path: yes
shell_abbreviations:
  - name: an
    value: ansible
  - name: ap
    value: ansible-playbook
  - name: d
    value: docker
  - name: dm
    value: docker-machine
  - name: dsw
    value: docker swarm
  - name: ds
    value: docker service
  - name: dc
    value: docker compose
  - name: g
    value: git
  - name: gca
    value: git commit --amend
  - name: gcane
    value: git commit --amend --no-edit
  - name: gd
    value: git diff
  - name: gdc
    value: git diff --cached
  - name: gst
    value: git stash
  - name: gsp
    value: git stash pop
  - name: gs
    value: git status
  - name: gh
    value: op plugin run -- gh
  - name: glab
    value: op plugin run -- glab
  - name: doctl
    value: op plugin run -- doctl
  - name: l
    value: ls
  - name: la
    value: ls -A
  - name: ll
    value: ls -l
  - name: psg
    value: psgrep
  - name: words
    value: "grep < /usr/share/dict/words"
  - name: lw
    value: "ls -l (which"
    shell_alias: no
  - name: v
    value: "{{ _uv.editor }}"
  - name: man
    value: viman
    shell_alias: no
  - name: e
    value: "{{ _uv.editor }}"
    shell_alias: no
