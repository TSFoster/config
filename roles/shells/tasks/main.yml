---
- name: Install shell packages
  ansible.builtin.include_role:
    name: common
    tasks_from: install_packages
  vars:
    common_packages: "{{ shells_packages }}"
- name: Add fish to /etc/shells (macOS — Homebrew path)
  ansible.builtin.lineinfile:
    path: /etc/shells
    line: "{{ homebrew_brew_bin_path }}/fish"
    state: present
  become: true
  when: ansible_facts['system'] == 'Darwin'
- name: Add fish to /etc/shells (Linux — system path)
  ansible.builtin.lineinfile:
    path: /etc/shells
    line: "{{ shells_linux_fish_path }}"
  become: true
  when: ansible_facts['system'] == 'Linux'
- name: Set fish as default shell (macOS)
  ansible.builtin.user:
    name: "{{ shells_target_user }}"
    shell: "{{ homebrew_brew_bin_path }}/fish"
  become: true
  when: ansible_facts['system'] == 'Darwin'
- name: Set fish as default shell (Linux)
  ansible.builtin.user:
    name: "{{ shells_target_user }}"
    shell: "{{ shells_linux_fish_path }}"
  become: true
  when: ansible_facts['system'] == 'Linux'
- name: Add .hushlogin
  ansible.builtin.file:
    path: "{{ shells_hushlogin_path }}"
    state: touch
    modification_time: preserve
    access_time: preserve
    mode: "0644"
- name: Add zprofile
  ansible.builtin.template:
    src: zprofile.j2
    dest: "{{ shells_zprofile_path }}"
    mode: "0644"
- name: Add bash_profile
  ansible.builtin.template:
    src: bash_profile.j2
    dest: "{{ shells_bash_profile_path }}"
    mode: "0644"
- name: Create fish_variables
  ansible.builtin.file:
    path: "{{ shells_fish_variables_path }}"
    state: touch
    modification_time: preserve
    access_time: preserve
    mode: "0644"
  tags:
    - vars_debug
- name: Set fish universal shell variables
  ansible.builtin.lineinfile:
    path: "{{ shells_fish_variables_path }}"
    create: true
    mode: "0644"
    regexp: "^SETUVAR( +--export)?( +--path)? +{{ item.name }}:"
    line: >-
      {{
        'SETUVAR'
        ~ (item.export | default(false, true) | ternary(' --export', ''))
        ~ (item.path | default(false, true) | ternary(' --path', ''))
        ~ ' '
        ~ item.name
        ~ ':'
        ~ (
          item.value_multiple | default([item.value]) | reject('equalto', '') | list
          | join('\x1e')
          | replace(' ', '\x20')
          | replace('%', '\x25')
          | replace('(', '\x28')
          | replace(')', '\x29')
          | replace('-', '\x2d')
          | replace('.', '\x2e')
          | replace('<', '\x3c')
          | replace('=', '\x3d')
          | replace('>', '\x3e')
          | replace('{', '\x7b')
          | replace('}', '\x7d')
          | replace('~', '\x7e')
        )
      }}
  loop: "{{ shells_variables + shells_fish_universal_variables }}"
  tags:
    - vars_debug
- name: Set fish abbreviations
  ansible.builtin.lineinfile:
    path: "{{ shells_fish_variables_path }}"
    create: true
    mode: "0644"
    regexp: "^SETUVAR _fish_abbr_{{ item.name }}:"
    line: >-
      SETUVAR _fish_abbr_{{ item.name }}:
      {{- [item.value]
        | join('\x1e')
        | replace(' ', '\x20')
        | replace('%', '\x25')
        | replace('(', '\x28')
        | replace(')', '\x29')
        | replace('-', '\x2d')
        | replace('.', '\x2e')
        | replace('<', '\x3c')
        | replace('=', '\x3d')
        | replace('>', '\x3e')
        | replace('{', '\x7b')
        | replace('}', '\x7d')
        | replace('~', '\x7e')
      }}
  loop: "{{ shells_abbreviations }}"
  tags:
    - vars_debug
- name: Copy fish config
  block:
    - name: Copy dirs
      ansible.builtin.copy:
        src: "{{ item }}/"
        dest: "{{ shells_fish_config_dir }}/{{ item }}/"
        mode: preserve
      loop:
        - bin
        - functions
        - completions
    - name: Make config.fish
      ansible.builtin.template:
        src: "config.fish.j2"
        dest: "{{ shells_fish_config_dir }}/config.fish"
        mode: "0644"
- name: Make conf.d dir
  ansible.builtin.file:
    path: "{{ shells_fish_conf_d_dir }}"
    state: directory
    mode: "0755"
- name: Make themes dir
  ansible.builtin.file:
    path: "{{ shells_fish_themes_dir }}"
    state: directory
    mode: "0755"
- name: Remove legacy fish Homebrew config
  ansible.builtin.file:
    path: "{{ shells_fish_conf_d_dir }}/_0homebrew.fish"
    state: absent
  when: ansible_facts['system'] == 'Darwin'
- name: Check fisher installed
  ansible.builtin.command:
    cmd: 'fish -c "functions -q fisher; and echo installed; exit 0"'
  register: shells_which_fisher
  changed_when: false
  tags:
    - fisher
- name: Install fisher
  when: shells_which_fisher.stdout.find('installed') == -1
  tags:
    - fisher
  block:
    - name: Download fisher installer
      ansible.builtin.get_url:
        url: https://raw.githubusercontent.com/jorgebucaran/fisher/main/functions/fisher.fish
        dest: "{{ shells_fisher_installer_path }}"
        mode: "0644"
    - name: Source fisher installer
      ansible.builtin.command:
        cmd: >-
          fish -c 'source {{ shells_fisher_installer_path }} &&
          fisher install jorgebucaran/fisher'
      changed_when: true
- name: Get list of plugins
  ansible.builtin.command:
    cmd: "fish -c 'fisher list'"
  register: shells_fisher_list
  changed_when: false
  tags:
    - fisher
- name: Install fisher plugins
  ansible.builtin.command:
    cmd: "fish -c 'fisher install {{ item }}'"
  changed_when: true
  when: shells_fisher_list.stdout.find(item) == -1
  loop: "{{ shells_fisher_plugins }}"
  tags:
    - fisher
- name: Set fish theme
  ansible.builtin.copy:
    dest: "{{ shells_theme_config_path }}"
    mode: "0644"
    content: |
      fish_config theme choose {{ shells_fish_theme_name }} --color-theme={{ shells_fish_theme_variant }} >/dev/null 2>/dev/null
  tags:
    - fisher
- name: Install thefuck for fish
  ansible.builtin.command:
    creates: "{{ shells_thefuck_alias_path }}"
    cmd: fish -c 'thefuck --alias > {{ shells_thefuck_alias_path }}'
- name: Add atuin config
  ansible.builtin.copy:
    src: "atuin"
    dest: "{{ shells_atuin_config_dir }}/"
    mode: preserve
