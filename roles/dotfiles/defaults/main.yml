---
dotfiles_local_dir: "{{ ansible_facts['env']['HOME'] }}/.local"
dotfiles_bin_dir: "{{ dotfiles_local_dir }}/bin"
dotfiles_editorconfig_path: "{{ ansible_facts['env']['HOME'] }}/.editorconfig"
dotfiles_bat_dir: "{{ config_dir }}/bat"
dotfiles_ghostty_config_dir: "{{ config_dir }}/ghostty"
dotfiles_gh_config_dir: "{{ config_dir }}/gh"
dotfiles_ripgrep_config_dir: "{{ config_dir }}"
dotfiles_yazi_config_dir: "{{ config_dir }}/yazi"
dotfiles_yazi_light_config_dir: "{{ config_dir }}/yazi-light"
dotfiles_git_config_dir: "{{ config_dir }}/git"
dotfiles_git_credentials_path: "{{ config_dir }}/git/credentials.gitconfig"
dotfiles_warpd_config_dir: "{{ config_dir }}/warpd"
dotfiles_pushover_config_dir: "{{ config_dir }}/pushover"
dotfiles_pushover_user: "{{ pushover_user | default('') }}"
dotfiles_pushover_token: "{{ pushover_token | default('') }}"

dotfiles_bat_theme_base_url: https://raw.githubusercontent.com/catppuccin/bat/main/themes
dotfiles_yazi_theme_base_url: https://raw.githubusercontent.com/catppuccin/yazi/main/themes
dotfiles_yazi_catppuccin_accent: teal
dotfiles_bat_themes:
  - Catppuccin Latte.tmTheme
  - Catppuccin Frappe.tmTheme
  - Catppuccin Macchiato.tmTheme
  - Catppuccin Mocha.tmTheme

# Native macOS notifications (via terminal-notifier) when Claude Code or
# Antigravity CLI need input or finish a run.
dotfiles_claude_dir: "{{ ansible_facts['env']['HOME'] }}/.claude"
dotfiles_claude_settings_path: "{{ dotfiles_claude_dir }}/settings.json"
dotfiles_claude_rules_path: "{{ dotfiles_claude_dir }}/CLAUDE.md"
dotfiles_claude_hooks_patch:
  hooks:
    Notification:
      - hooks:
          - type: command
            command: "{{ dotfiles_bin_dir }}/agent-notify claude waiting"
            timeout: 10
    Stop:
      - hooks:
          - type: command
            command: "{{ dotfiles_bin_dir }}/agent-notify claude done"
            timeout: 10

dotfiles_gemini_dir: "{{ ansible_facts['env']['HOME'] }}/.gemini"
dotfiles_gemini_rules_path: "{{ dotfiles_gemini_dir }}/rules.md"
dotfiles_antigravity_config_dir: "{{ dotfiles_gemini_dir }}/antigravity-cli"
dotfiles_antigravity_settings_path: "{{ dotfiles_antigravity_config_dir }}/settings.json"
dotfiles_antigravity_hooks_path: "{{ dotfiles_antigravity_config_dir }}/hooks.json"
dotfiles_antigravity_notifications_patch:
  notifications: true
dotfiles_antigravity_hooks_patch:
  agent-notify:
    Stop:
      - type: command
        command: "{{ dotfiles_bin_dir }}/agent-notify agy done"
        timeout: 10

dotfiles_llm_neovim_rule_block: |
  # Neovim Integration
  When `$NVIM` is set in the environment, you are running inside a Neovim terminal session.
  - When referring to visual selections or context from the active Neovim editor window, use `nvim_ref` (for file range `file.ext#L10-L20`) or `nvim_selection` (for JSON details & text content).
  - Neovim remote expressions can also be evaluated directly using `nvim --server "$NVIM" --remote-expr 'luaeval(...)'`.

