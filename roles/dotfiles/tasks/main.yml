---
- name: Create ~/.local directory structure
  ansible.builtin.file:
    state: directory
    dest: "{{ dotfiles_local_dir }}/{{ item }}"
    mode: "0755"
  loop:
    - bin
    - cache
    - lib
    - share
    - state
- name: Add bin files
  ansible.builtin.copy:
    src: mailbox-count
    dest: "{{ dotfiles_bin_dir }}/"
    mode: preserve
  when: ansible_facts["system"] == "Darwin"
- name: Ensure ghostty config directory exists
  ansible.builtin.file:
    state: directory
    dest: "{{ dotfiles_ghostty_config_dir }}"
    mode: "0755"
- name: Add ghostty config
  ansible.builtin.template:
    src: ghostty.toml.j2
    dest: "{{ dotfiles_ghostty_config_dir }}/config"
    mode: preserve
- name: Add gh config
  ansible.posix.synchronize:
    src: "{{ role_path }}/files/gh/"
    dest: "{{ dotfiles_gh_config_dir }}/"
    recursive: true
    links: true
    delete: true
- name: Add ripgrep config
  ansible.builtin.copy:
    src: ripgreprc
    dest: "{{ dotfiles_ripgrep_config_dir }}/"
    mode: preserve
- name: Ensure yazi config directories exist
  ansible.builtin.file:
    state: directory
    dest: "{{ item }}"
    mode: "0755"
  loop:
    - "{{ dotfiles_yazi_config_dir }}"
    - "{{ dotfiles_yazi_light_config_dir }}"
- name: Download Catppuccin yazi themes
  ansible.builtin.get_url:
    url: "{{ item.url }}"
    dest: "{{ item.dest }}"
    mode: "0644"
  loop:
    - url: "{{ dotfiles_yazi_theme_base_url }}/mocha/catppuccin-mocha-{{ dotfiles_yazi_catppuccin_accent }}.toml"
      dest: "{{ dotfiles_yazi_config_dir }}/theme.toml"
    - url: "{{ dotfiles_yazi_theme_base_url }}/latte/catppuccin-latte-{{ dotfiles_yazi_catppuccin_accent }}.toml"
      dest: "{{ dotfiles_yazi_light_config_dir }}/theme.toml"
- name: Set yazi syntect themes
  ansible.builtin.lineinfile:
    path: "{{ item.path }}"
    regexp: "^syntect_theme = "
    line: "{{ item.line }}"
  loop:
    - path: "{{ dotfiles_yazi_config_dir }}/theme.toml"
      line: 'syntect_theme = "~/.config/bat/Catppuccin Mocha.tmTheme"'
    - path: "{{ dotfiles_yazi_light_config_dir }}/theme.toml"
      line: 'syntect_theme = "~/.config/bat/Catppuccin Latte.tmTheme"'
- name: Add bat themes
  block:
    - name: Ensure bat config directory exists
      ansible.builtin.file:
        state: directory
        dest: "{{ dotfiles_bat_dir }}"
        mode: "0755"
    - name: Download Catppuccin bat themes
      ansible.builtin.get_url:
        url: "{{ dotfiles_bat_theme_base_url }}/{{ item | urlencode }}"
        dest: "{{ dotfiles_bat_dir }}/{{ item }}"
        mode: "0644"
        force: false
      loop: "{{ dotfiles_bat_themes }}"
- name: Add git config
  block:
    - name: Sync config except credentials
      ansible.posix.synchronize:
        src: "{{ role_path }}/files/git/"
        dest: "{{ dotfiles_git_config_dir }}/"
        recursive: true
        links: true
        delete: true
        rsync_opts:
          - "--exclude=credentials.gitconfig"
    - name: Add git credentials
      ansible.builtin.template:
        src: credentials.gitconfig.j2
        dest: "{{ dotfiles_git_credentials_path }}"
        mode: "0600"
- name: Add editorconfig
  ansible.builtin.copy:
    src: editorconfig
    dest: "{{ dotfiles_editorconfig_path }}"
    mode: preserve
- name: Ensure warpd directory exists
  ansible.builtin.file:
    state: directory
    dest: "{{ dotfiles_warpd_config_dir }}"
    mode: "0755"
- name: Add warpd config
  ansible.builtin.copy:
    src: warpd
    dest: "{{ dotfiles_warpd_config_dir }}/config"
    mode: preserve
