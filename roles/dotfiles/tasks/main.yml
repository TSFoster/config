---
- name: Create ~/.local directory structure
  ansible.builtin.file:
    state: directory
    dest: "{{ dotfiles_local_dir }}/{{ item }}"
    mode: "0755"
  loop:
    - bin
    - cache
    - lib
    - share
    - state
- name: Add bin files
  ansible.builtin.copy:
    src: "{{ item }}"
    dest: "{{ dotfiles_bin_dir }}/"
    mode: preserve
  loop:
    - mailbox-count
    - pushover
    - afk
  when: ansible_facts["system"] == "Darwin"
- name: Ensure ghostty config directory exists
  ansible.builtin.file:
    state: directory
    dest: "{{ dotfiles_ghostty_config_dir }}"
    mode: "0755"
- name: Add ghostty config
  ansible.builtin.template:
    src: ghostty.toml.j2
    dest: "{{ dotfiles_ghostty_config_dir }}/config"
    mode: preserve
- name: Add gh config
  ansible.posix.synchronize:
    src: "{{ role_path }}/files/gh/"
    dest: "{{ dotfiles_gh_config_dir }}/"
    recursive: true
    links: true
    delete: true
- name: Add ripgrep config
  ansible.builtin.copy:
    src: ripgreprc
    dest: "{{ dotfiles_ripgrep_config_dir }}/"
    mode: preserve
- name: Ensure yazi config directories exist
  ansible.builtin.file:
    state: directory
    dest: "{{ item }}"
    mode: "0755"
  loop:
    - "{{ dotfiles_yazi_config_dir }}"
    - "{{ dotfiles_yazi_light_config_dir }}"
- name: Download Catppuccin yazi themes
  ansible.builtin.get_url:
    url: "{{ item.url }}"
    dest: "{{ item.dest }}"
    mode: "0644"
    force: false
  loop:
    - url: "{{ dotfiles_yazi_theme_base_url }}/mocha/catppuccin-mocha-{{ dotfiles_yazi_catppuccin_accent }}.toml"
      dest: "{{ dotfiles_yazi_config_dir }}/theme.toml"
    - url: "{{ dotfiles_yazi_theme_base_url }}/latte/catppuccin-latte-{{ dotfiles_yazi_catppuccin_accent }}.toml"
      dest: "{{ dotfiles_yazi_light_config_dir }}/theme.toml"
- name: Set yazi syntect themes
  ansible.builtin.lineinfile:
    path: "{{ item.path }}"
    regexp: "^syntect_theme = "
    line: "{{ item.line }}"
  loop:
    - path: "{{ dotfiles_yazi_config_dir }}/theme.toml"
      line: 'syntect_theme = "~/.config/bat/Catppuccin Mocha.tmTheme"'
    - path: "{{ dotfiles_yazi_light_config_dir }}/theme.toml"
      line: 'syntect_theme = "~/.config/bat/Catppuccin Latte.tmTheme"'
- name: Add bat themes
  block:
    - name: Ensure bat config directory exists
      ansible.builtin.file:
        state: directory
        dest: "{{ dotfiles_bat_dir }}"
        mode: "0755"
    - name: Download Catppuccin bat themes
      ansible.builtin.get_url:
        url: "{{ dotfiles_bat_theme_base_url }}/{{ item | urlencode }}"
        dest: "{{ dotfiles_bat_dir }}/{{ item }}"
        mode: "0644"
        force: false
      loop: "{{ dotfiles_bat_themes }}"
- name: Add git config
  block:
    - name: Sync config except credentials
      ansible.posix.synchronize:
        src: "{{ role_path }}/files/git/"
        dest: "{{ dotfiles_git_config_dir }}/"
        recursive: true
        links: true
        delete: true
        rsync_opts:
          - "--exclude=credentials.gitconfig"
    - name: Add git credentials
      ansible.builtin.template:
        src: credentials.gitconfig.j2
        dest: "{{ dotfiles_git_credentials_path }}"
        mode: "0600"
- name: Add editorconfig
  ansible.builtin.copy:
    src: editorconfig
    dest: "{{ dotfiles_editorconfig_path }}"
    mode: preserve
- name: Ensure warpd directory exists
  ansible.builtin.file:
    state: directory
    dest: "{{ dotfiles_warpd_config_dir }}"
    mode: "0755"
- name: Add warpd config
  ansible.builtin.copy:
    src: warpd
    dest: "{{ dotfiles_warpd_config_dir }}/config"
    mode: preserve
- name: Add pushover credentials
  block:
    - name: Ensure pushover config directory exists
      ansible.builtin.file:
        state: directory
        dest: "{{ dotfiles_pushover_config_dir }}"
        mode: "0700"
    - name: Add pushover user key
      ansible.builtin.copy:
        content: "{{ dotfiles_pushover_user }}"
        dest: "{{ dotfiles_pushover_config_dir }}/user"
        mode: "0600"
      when: dotfiles_pushover_user != ""
    - name: Add pushover token
      ansible.builtin.copy:
        content: "{{ dotfiles_pushover_token }}"
        dest: "{{ dotfiles_pushover_config_dir }}/token"
        mode: "0600"
      when: dotfiles_pushover_token != ""

- name: Add agent notification support (terminal-notifier is macOS only)
  when: ansible_facts["system"] == "Darwin"
  block:
    - name: Add agent-notify script
      ansible.builtin.copy:
        src: agent-notify
        dest: "{{ dotfiles_bin_dir }}/"
        mode: preserve
    - name: Add Claude Code notification hooks
      ansible.builtin.include_tasks: _merge_json.yml
      vars:
        dotfiles_merge_json_dest: "{{ dotfiles_claude_settings_path }}"
        dotfiles_merge_json_patch: "{{ dotfiles_claude_hooks_patch }}"
    - name: Add Antigravity CLI Stop hook
      ansible.builtin.include_tasks: _merge_json.yml
      vars:
        dotfiles_merge_json_dest: "{{ dotfiles_antigravity_hooks_path }}"
        dotfiles_merge_json_patch: "{{ dotfiles_antigravity_hooks_patch }}"
- name: Enable Antigravity CLI native notifications
  ansible.builtin.include_tasks: _merge_json.yml
  vars:
    dotfiles_merge_json_dest: "{{ dotfiles_antigravity_settings_path }}"
    dotfiles_merge_json_patch: "{{ dotfiles_antigravity_notifications_patch }}"

- name: Add Neovim integration rule block to CLAUDE.md and rules.md
  block:
    - name: Ensure LLM config directories exist
      ansible.builtin.file:
        state: directory
        dest: "{{ item }}"
        mode: "0755"
      loop:
        - "{{ dotfiles_claude_dir }}"
        - "{{ dotfiles_gemini_dir }}"
    - name: Ensure Neovim integration block is present in LLM rule files
      ansible.builtin.blockinfile:
        path: "{{ item }}"
        create: true
        mode: "0644"
        marker: "<!-- {mark} ANSIBLE MANAGED BLOCK: Neovim Integration -->"
        block: "{{ dotfiles_llm_neovim_rule_block }}"
      loop:
        - "{{ dotfiles_claude_rules_path }}"
        - "{{ dotfiles_gemini_rules_path }}"


