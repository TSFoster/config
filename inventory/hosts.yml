---
all:
  children:
    workstations:
      hosts:
        localhost:
          ansible_connection: local
          ansible_python_interpreter: "{{ lookup('pipe', 'command -v python3') }}"
    # Debian machines managed by this repo. `home_server` is currently the
    # only one, but it wears two hats — an always-on server and the box
    # hooked up to the TV for gaming — so it's a member of both `servers`
    # and `tv` rather than a single group. Don't assume they're the same
    # physical host elsewhere in the repo; if they ever split onto separate
    # boxes, each just moves into its own group here.
    debian:
      children:
        servers:
          hosts:
            home_server: {}
        tv:
          hosts:
            home_server: {}
